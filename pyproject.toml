[project]
name = "review-intel"
version = "0.1.0"
description = "AI agent system that turns public app-store reviews into weekly, version-aware insights for game teams."
readme = "README.md"
authors = [
    { name = "Emin Özbayraktar", email = "emin.ozbayraktarr@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.10,<3",
    "google-play-scraper>=1.2.7,<2",
    "httpx>=0.28",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.3,<7",
    "sqlalchemy>=2.1.9",
    "sqlite-vec>=0.1.9,<0.2",
    "torch>=2.15",
    "typer>=0.29.2",
]

[project.scripts]
review-intel = "review_intel.cli:app"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# google-play-scraper ships no type hints; we type its output at our boundary instead.
module = ["google_play_scraper", "google_play_scraper.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# sqlite-vec ships no type hints; we only call load() and serialize_float32().
module = ["sqlite_vec"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

# Embeddings run on CPU. Without this, Linux (CI) would pull multi-GB CUDA wheels for torch.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
